<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería de Imágenes</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 20px;
        }

        .galeria{
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        .galeria img{
            width: 250px;
            height: 180px;
            object-fit: cover;
            border-radius: 10px;
            transition: 0.3s;
        }

        .galeria img:hover{
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <h1>Galería de Imágenes</h1>

    <div class="galeria">
        <img src="https://picsum.photos/id/1015/400/300" alt="Imagen 1">
        <img src="https://picsum.photos/id/1025/400/300" alt="Imagen 2">
        <img src="https://picsum.photos/id/1035/400/300" alt="Imagen 3">
        <img src="https://picsum.photos/id/1045/400/300" alt="Imagen 4">
    </div>

</body>
</html>
